name: Keystroke Dynamics CI Pipeline

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate module imports
      run: |
        python -c "import pipeline, app; print('Application and pipeline modules loaded successfully.')"

    - name: Train baseline model
      run: |
        python train.py --model_type random_forest --n_estimators 100 --max_depth 6 --tune_threshold --save_model --run_name "CI_Automated_Baseline"

    - name: Run test suite with pytest
      run: |
        pytest -v --tb=short

    - name: Verify drift check execution
      run: |
        python monitoring/drift_check.py
